# Publishes to npm AND the official MCP registry when a version tag (v3.4.0
# style) is pushed. Started by `node release.mjs <version>`, which is the only
# supported way to cut a release — never `npm publish` from a laptop.
#
# npm uses Trusted Publishing: no tokens, no secrets — npmjs.com is configured
# to trust this exact workflow, and npm attaches provenance automatically
# (the "built and signed from this commit" badge on the package page). The MCP
# registry uses GitHub OIDC, also tokenless: it trusts this repository's
# identity, which is why `id-token: write` below matters twice.
name: publish

on:
  push:
    tags: ['v*']
  # Re-publish the MCP listing for a version npm already serves: 8.9.0's run
  # gave up waiting for npm after five minutes, npm served it a minute later,
  # and the listing was never published. This path skips npm and runs the
  # registry steps against the tag's own files.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version already on npm whose MCP listing to publish (e.g. 8.9.0)'
        required: true

permissions:
  contents: read
  id-token: write # OIDC token for npm trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # Actions pinned to commits: this job holds the token that publishes to
      # npm, so a moved tag upstream must not be able to change what runs here.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref }}

      # One name for the version whichever way the job started
      - name: Name the version
        run: echo "VERSION=${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}" >> "$GITHUB_ENV"

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs a recent npm; pinned, so the publish step
      # runs the npm that was tested, not whatever shipped last night
      - run: npm install -g npm@12.0.2

      # The tag must match every file that carries the version — catches a
      # forgotten bump before anything reaches the public
      - name: Check the tag matches package.json and server.json
        run: |
          TAG=${VERSION#v}
          PKG=$(node -p "require('./package.json').version")
          if [ "$PKG" != "$TAG" ]; then
            echo "Tag v$TAG does not match package.json $PKG" >&2
            exit 1
          fi
          SRV=$(node -p "require('./server.json').version")
          SRVPKG=$(node -p "require('./server.json').packages[0].version")
          MCPNAME=$(node -p "require('./package.json').mcpName")
          SRVNAME=$(node -p "require('./server.json').name")
          if [ "$SRV" != "$TAG" ] || [ "$SRVPKG" != "$TAG" ]; then
            echo "server.json is at $SRV / package $SRVPKG, tag is v$TAG" >&2
            exit 1
          fi
          if [ "$MCPNAME" != "$SRVNAME" ]; then
            echo "mcpName $MCPNAME does not match server.json name $SRVNAME" >&2
            exit 1
          fi

      # Smoke test: the CLI must run on a real directory before we ship it
      - name: Smoke test
        run: |
          node cli/roast.mjs . --no-open --out /tmp/self-roast.html
          test -s /tmp/self-roast.html

      # Snapshot suite: five fixture repos with frozen expected outputs.
      # A moved score, tile, verdict, rule or exclusion blocks the publish.
      - name: Snapshot tests
        run: node tests/run.mjs

      # Idempotent: a rerun after a lagging registry must not fail here on a
      # version that already went out.
      - name: Publish to npm
        if: github.event_name != 'workflow_dispatch'
        run: |
          if npm view "roast-my-design-system@${VERSION#v}" version >/dev/null 2>&1; then
            echo "npm already serves ${VERSION#v}; not publishing twice"
          else
            npm publish
          fi

      # ---- MCP registry: the listing at registry.modelcontextprotocol.io ----
      # Metadata only. It points at the npm package published a step ago, and
      # the registry verifies ownership by reading mcpName out of that exact
      # published package — which is why this runs after npm, not before.

      - name: Wait for npm to serve the new version
        run: |
          # up to 15 minutes: 8.9.0 took more than five
          for i in $(seq 1 90); do
            if npm view roast-my-design-system@${VERSION#v} version >/dev/null 2>&1; then
              echo "npm is serving ${VERSION#v}"; exit 0
            fi
            echo "waiting for npm... ($i)"; sleep 10
          done
          echo "npm never served ${VERSION#v}; the registry would reject the listing" >&2
          exit 1

      # Pinned version and checksum: a download that runs in the publish job
      # is part of the supply chain. Bump both lines together.
      - name: Install mcp-publisher
        run: |
          curl -sSL -o mcp-publisher.tgz "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz"
          echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  mcp-publisher.tgz" | sha256sum -c -
          tar xzf mcp-publisher.tgz mcp-publisher

      - name: Authenticate to the MCP registry (GitHub OIDC, no secrets)
        run: ./mcp-publisher login github-oidc

      - name: Publish the listing
        run: ./mcp-publisher publish
